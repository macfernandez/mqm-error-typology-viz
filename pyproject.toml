[project]
name = "mqm-error-typology-viz"
version = "0.1.0"
description = "Explorador HTML interactivo y autocontenido de la tipología de errores MQM-Core."
readme = "README.md"
requires-python = ">=3.13"
# The mqm_viz module uses the standard library only: no runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Only needed to run the narrative notebook (not required for build.py).
notebook = ["jupyterlab>=4.5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqm_viz"]
