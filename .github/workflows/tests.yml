name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # zlib.crc32 (used as the independent CRC check) needs Node >= 22.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: JS export-format tests
        run: node --test

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python package tests
        run: uv run python -m unittest discover -s tests -v
